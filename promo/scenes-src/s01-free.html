<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" /><title>ExamPool s01</title></head>
<body>
<template>
  <style>
    .ep1 { position:absolute; inset:0; overflow:hidden; background:var(--rf-bg,#010102);
      color:#fff; font-family:"Pretendard", system-ui, sans-serif; }
    .ep1 .stage { position:absolute; inset:0; will-change:transform; }
    .ep1 .glow { position:absolute; left:-14%; top:-26%; width:76%; height:124%;
      background:radial-gradient(closest-side, color-mix(in srgb, var(--rf-accent,#5e6ad2) 30%, transparent), transparent 72%);
      filter:blur(30px); opacity:0; }
    .ep1 .flash { position:absolute; inset:0; background:var(--rf-accent,#5e6ad2); opacity:0; }
    .ep1 .kick { position:absolute; top:6%; left:4%; font-family:ui-monospace,Menlo,monospace;
      font-size:22px; font-weight:700; letter-spacing:.22em; color:rgba(255,255,255,.34); }
    .ep1 .lead { position:absolute; top:17%; left:4%; font-size:48px; font-weight:600;
      letter-spacing:-.02em; color:rgba(255,255,255,.6); }
    .ep1 .big { position:absolute; top:26%; left:4%; }
    .ep1 .ln { font-size:272px; line-height:1.04; }
    .ep1 .ln i { display:inline-block; font-style:normal; font-size:1em; font-weight:800;
      letter-spacing:-.075em; line-height:1.04; opacity:0; will-change:transform, opacity; }
    .ep1 .ln--hot i { color:var(--rf-accent,#5e6ad2); }
    .ep1 .bar { position:absolute; left:4%; top:86%; height:16px; width:52%;
      background:var(--rf-accent,#5e6ad2); transform-origin:left center; }
    .ep1 .tag { position:absolute; right:4%; bottom:6%; font-family:ui-monospace,Menlo,monospace;
      font-size:18px; font-weight:700; letter-spacing:.22em; color:rgba(255,255,255,.3); }
    /* --- 교과서 페이지 스택 --- */
    .ep1 .deck { position:absolute; right:5%; top:20%; width:470px; height:600px; }
    .ep1 .pg { position:absolute; left:0; top:0; width:100%; height:100%;
      background:#efeade; border-radius:10px; padding:34px 32px; box-sizing:border-box;
      box-shadow:0 30px 70px rgba(0,0,0,.75); will-change:transform, opacity; }
    .ep1 .pg .h { height:16px; width:58%; background:#4a463d; border-radius:8px; margin-bottom:22px; }
    .ep1 .pg .l { height:11px; background:#9c968a; border-radius:6px; margin-bottom:15px; }
    .ep1 .pg .l.s { width:72%; } .ep1 .pg .l.m { width:88%; } .ep1 .pg .l.f { width:100%; }
    .ep1 .pg .box { height:120px; border:2px solid #b3ac9c; border-radius:6px; margin:22px 0; }
    .ep1 .scan { position:absolute; right:5%; top:20%; width:470px; height:5px;
      background:linear-gradient(90deg, transparent, var(--rf-accent,#5e6ad2), transparent); opacity:0; }
    .ep1 .pno { position:absolute; right:5%; top:83%; width:470px; text-align:right;
      font-family:ui-monospace,Menlo,monospace; font-size:34px; font-weight:700;
      color:var(--rf-accent,#5e6ad2); }
    .ep1 .pno span { display:none; }
    .ep1 .pno span.on { display:inline; }
  </style>
  <div class="ep1" data-rf-fragment-version="1.0" data-composition-id="free-s01">
    <div class="stage">
      <div class="glow" aria-hidden="true"></div>
      <div class="kick">EXAMPOOL / 01</div>
      <div class="lead">선지 하나 쓸 때마다</div>
      <div class="deck" aria-label="교과서를 계속 넘기는 모습">
        <div class="pg p6"><div class="h"></div><div class="l f"></div><div class="l m"></div><div class="box"></div><div class="l f"></div><div class="l s"></div></div>
        <div class="pg p5"><div class="h"></div><div class="l m"></div><div class="l f"></div><div class="l s"></div><div class="box"></div><div class="l m"></div></div>
        <div class="pg p4"><div class="h"></div><div class="l f"></div><div class="l s"></div><div class="l m"></div><div class="box"></div><div class="l f"></div></div>
        <div class="pg p3"><div class="h"></div><div class="box"></div><div class="l f"></div><div class="l m"></div><div class="l s"></div><div class="l f"></div></div>
        <div class="pg p2"><div class="h"></div><div class="l s"></div><div class="l f"></div><div class="box"></div><div class="l m"></div><div class="l f"></div></div>
        <div class="pg p1"><div class="h"></div><div class="l f"></div><div class="l m"></div><div class="l f"></div><div class="box"></div><div class="l s"></div></div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div class="pno" aria-hidden="true"><span class="n1 on">p.142</span><span class="n2">p.147</span><span class="n3">p.153</span><span class="n4">p.161</span><span class="n5">p.168</span><span class="n6">p.174</span></div>
      <div class="big" aria-label="매번 처음부터">
        <div class="ln l1"><i>매</i><i>번</i></div>
        <div class="ln ln--hot l2"><i>처</i><i>음</i><i>부</i><i>터</i></div>
      </div>
      <div class="bar" aria-hidden="true"></div>
      <div class="tag">PAIN / 01</div>
    </div>
    <div class="flash" aria-hidden="true"></div>
  </div>
  <script>
    (() => {
      const r = document.querySelector('[data-composition-id="free-s01"]');
      if (!r) return;
      const stage=r.querySelector(".stage"), glow=r.querySelector(".glow"), flash=r.querySelector(".flash"),
            kick=r.querySelector(".kick"), lead=r.querySelector(".lead"),
            bar=r.querySelector(".bar"), tag=r.querySelector(".tag"),
            deck=r.querySelector(".deck"), scan=r.querySelector(".scan");
      const c1=Array.from(r.querySelectorAll(".l1 i"));
      const c2=Array.from(r.querySelectorAll(".l2 i"));
      const pg=["p1","p2","p3","p4","p5","p6"].map(k=>r.querySelector("."+k));
      const no=["n1","n2","n3","n4","n5","n6"].map(k=>r.querySelector("."+k));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set(bar,{scaleX:0})
        .fromTo(stage,{scale:1.0},{scale:1.04,duration:4.4,ease:"none"},0)
        .fromTo(kick,{opacity:0,x:-20},{opacity:1,x:0,duration:.26,ease:"power3.out"},0)
        .fromTo(tag,{opacity:0},{opacity:1,duration:.26},0)
        .fromTo(glow,{opacity:0},{opacity:1,duration:.9,ease:"power2.out"},0)
        .fromTo(lead,{opacity:0,y:18},{opacity:1,y:0,duration:.3,ease:"power3.out"},0.2727)
        .fromTo(deck,{opacity:0,x:90,rotate:4},{opacity:1,x:0,rotate:0,duration:.5,ease:"expo.out"},0.2727)
        .fromTo(c1,{opacity:0,y:-150,rotate:(i)=>i%2?-17:15,scale:.62,transformOrigin:"50% 50%"},
                   {opacity:1,y:0,rotate:0,scale:1,duration:.66,ease:"back.out(2.3)",stagger:.06},0.5455)
        .fromTo(c2,{opacity:0,y:150,rotate:(i)=>i%2?13:-13,scale:.62,transformOrigin:"50% 50%"},
                   {opacity:1,y:0,rotate:0,scale:1,duration:.66,ease:"back.out(2.5)",stagger:.05},1.0909)
        .fromTo(flash,{opacity:0},{opacity:.15,duration:.05,ease:"none"},1.0909)
        .to(flash,{opacity:0,duration:.2,ease:"power2.out"},1.1409)
        .to(bar,{scaleX:1,duration:.42,ease:"expo.out"},1.6364);
      // 페이지 넘김: 1.5비트부터 반박자마다 (교과서를 계속 뒤지는 리듬)
      const flip=[0.8182,1.0909,1.3636,1.6364,1.9091,2.1818,2.4545,2.7273,3.0000,3.2727];
      pg.forEach((p,i)=>{
        tl.to(p,{y:-780,rotate:-7,opacity:0,duration:.34,ease:"power2.in"},flip[i]);
      });
      no.forEach((n,i)=>{
        if(i===0) return;
        tl.set(no[i-1],{display:"none"},flip[i-1]).set(n,{display:"inline"},flip[i-1]);
      });
      tl.fromTo(scan,{opacity:0,y:0},{opacity:.9,y:600,duration:.9,ease:"none"},0.8182)
        .to(scan,{opacity:0,duration:.3},1.7182)
        .fromTo(scan,{opacity:0,y:0},{opacity:.9,y:600,duration:.9,ease:"none"},2.1818)
        .to(scan,{opacity:0,duration:.3},3.0818);
      window.__timelines["free-s01"]=tl; tl.seek(0);
    })();
  </script>
</template>
</body>
</html>
