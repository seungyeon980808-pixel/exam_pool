[project]
name = "exampool"
version = "0.1.0"
description = "중학교 과학 시험 출제 도구"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pymupdf>=1.24",
    "fonttools>=4.63",
    "pyperclip>=1.8",
    "playwright>=1.48",
    "mcp>=1.26",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyhwpx",
    "olefile",
    "pillow",
]

[project.optional-dependencies]
pdf-hwp = [
    "paddleocr>=3.7,<3.8",
    "paddlepaddle>=3.3,<3.4",
]
installer = [
    "pyinstaller>=6.20,<7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".tmp", ".omo", ".codex", "exports"]
